# DeployBuddy Automated Deployment Workflow
# Target: GitHub Pages (Static Site)
# Generated by DeployBuddy - Safe, inspectable, and student-friendly

name: Deploy with DeployBuddy to GitHub Pages

# 1. Trigger deployment on push to the default branch or allow manual execution
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 2. Least-privilege permissions block:
# Only request permissions needed to read code and publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 3. Concurrency management:
# Allow one concurrent deployment at a time, queueing any new runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. Build Job: Installs dependencies and generates static output directory
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js runtime (detected version 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install exact dependencies using project package manager
      - name: Install dependencies
        run: npm install

      # Build static distribution files
      - name: Build site
        run: npm run build

      - name: Setup Pages configuration
        uses: actions/configure-pages@v5

      # Upload the built output directory as a GitHub Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  # 2. Deploy Job: Deploys the built artifact to GitHub Pages hosting
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
